name: Solaria GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:
    inputs:
      validation:
        description: "Browser validation scope (full or focused feedback patches)"
        type: choice
        default: full
        options:
          [
            full,
            art-feedback,
            visibility-feedback,
            gameplay-feedback,
            balance-feedback,
            maintenance-feedback,
            save-feedback,
            health-light-feedback,
            terrain-preview,
            theme-preview,
            variety-preview,
          ]
permissions:
  contents: read
concurrency:
  group: solaria-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      official_sha: ${{ steps.official-source.outputs.sha }}
    steps:
      - name: Preview must stay off main
        if: endsWith(inputs.validation, '-preview')
        run: test "$GITHUB_REF" != "refs/heads/main"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Type, unit and formatting validation
        env:
          VALIDATION_SCOPE: ${{ inputs.validation || 'full' }}
        run: |
          npm run check
          if [ "$VALIDATION_SCOPE" = "health-light-feedback" ]; then
            npx vitest run tests/unit/health-light.test.ts tests/unit/adventure-lighting.test.ts tests/unit/terrain-progression.test.ts tests/unit/advanced-cards.test.ts tests/unit/feedback-132.test.ts
          else
            npm test
          fi
          npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_PLAYTEST: ${{ endsWith(inputs.validation, '-preview') && 'terrain-1.3.0' || '' }}
      - name: Browser validation
        env:
          VALIDATION_SCOPE: ${{ inputs.validation || 'full' }}
        run: |
          if [ "$VALIDATION_SCOPE" = "art-feedback" ]; then
            npm run test:browser -- tests/browser/adventure-art.spec.ts tests/browser/last-polish.spec.ts --grep '短FX|美術回饋|精雕冒險 (meadow|volcano|castle)：|發光藍雷|扇形噴火'
          elif [ "$VALIDATION_SCOPE" = "visibility-feedback" ]; then
            npm run test:browser -- tests/browser/visibility-feedback.spec.ts
          elif [ "$VALIDATION_SCOPE" = "health-light-feedback" ]; then
            npm run test:browser -- tests/browser/health-light.spec.ts
          elif [ "$VALIDATION_SCOPE" = "save-feedback" ]; then
            npm run test:browser -- tests/browser/feedback-132.spec.ts --grep '嚴格密碼|舊命運'
          elif [ "$VALIDATION_SCOPE" = "maintenance-feedback" ]; then
            npm run test:browser -- tests/browser/feedback-132.spec.ts tests/browser/boss-cover-balance.spec.ts
          elif [ "$VALIDATION_SCOPE" = "balance-feedback" ]; then
            npm run test:browser -- tests/browser/boss-cover-balance.spec.ts tests/browser/boss-rework.spec.ts
          elif [ "$VALIDATION_SCOPE" = "gameplay-feedback" ]; then
            npm run test:browser -- tests/browser/boss-rework.spec.ts tests/browser/recovery.spec.ts
          elif [ "$VALIDATION_SCOPE" = "variety-preview" ]; then
            npm run test:browser -- tests/browser/named-room-themes.spec.ts --grep '月牙林灣|層階砂臺|雙島霜澤|噴岩扇丘|交織巨根|岔隙幽門|赤弦血灣|交織星軌|分岔門庭|保存重載'
          elif [ "$VALIDATION_SCOPE" = "theme-preview" ]; then
            npm run test:browser -- tests/browser/named-room-themes.spec.ts tests/browser/journal.spec.ts --grep '房名布局|首局手冊'
          elif [ "$VALIDATION_SCOPE" = "terrain-preview" ]; then
            npm run test:browser -- tests/browser/terrain-progression.spec.ts tests/browser/startup.spec.ts tests/browser/journal.spec.ts tests/browser/resonance.spec.ts --grep '首局手冊|WebGL 主選單|測試面板|密碼嚴格|全螢幕在|舊1.2.0|新地形畫面|首局先手冊|獨立存檔'
          else
            npm run test:browser
          fi
      - run: npm run build
        if: ${{ !endsWith(inputs.validation, '-preview') }}
        env:
          SOLARIA_PAGES: "1"
      - name: Keep preview build
        if: endsWith(inputs.validation, '-preview')
        run: mv dist preview-dist
      - uses: actions/checkout@v4
        if: endsWith(inputs.validation, '-preview')
        with:
          ref: main
          path: official
          persist-credentials: false
      - name: Preserve current official game and append isolated preview
        id: official-source
        if: endsWith(inputs.validation, '-preview')
        run: |
          echo "sha=$(git -C official rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cd official
          npm ci
          SOLARIA_PAGES=1 npm run build
          mkdir -p dist/preview/terrain-1.3.0
          cp -R ../preview-dist/. dist/preview/terrain-1.3.0/
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !endsWith(inputs.validation, '-preview') }}
        with:
          path: dist
      - uses: actions/upload-pages-artifact@v3
        if: endsWith(inputs.validation, '-preview')
        with:
          path: official/dist
      - uses: actions/upload-artifact@v4
        if: always() && endsWith(inputs.validation, '-preview')
        with:
          name: preview-browser-evidence
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pages-browser-failures
          path: test-results/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: ${{ endsWith(inputs.validation, '-preview') && 'solaria-playtest' || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse to overwrite a newer main deployment
        if: endsWith(inputs.validation, '-preview')
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.build.outputs.official_sha }}
        run: |
          observed=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$observed" = "$EXPECTED_SHA"
      - uses: actions/deploy-pages@v4
        id: deployment
